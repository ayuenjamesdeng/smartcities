{% extends "dashboard_base.html" %}
{% block title %}Add Signal — Smart City Platform{% endblock %}
{% block page_title %}Add Signal{% endblock %}
{% block signals_active %}active{% endblock %}
{% block content %}
<div class="card form-card" data-aos="fade-up">
  <div class="card-header">
    <h2>New Traffic Signal</h2>
  </div>
  <form method="post" action="{% url 'add_signal' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_location">Location</label>
      <input type="text" id="id_location" name="location" required>
    </div>
    <div class="form-group">
      <label for="id_signal_status">Status</label>
      <select id="id_signal_status" name="signal_status">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
        <option value="Maintenance">Maintenance</option>
      </select>
    </div>
    <div class="form-group">
      <label for="id_installation_date">Installation Date</label>
      <input type="date" id="id_installation_date" name="installation_date">
    </div>
    <div class="form-group">
      <label for="id_last_maintenance">Last Maintenance</label>
      <input type="date" id="id_last_maintenance" name="last_maintenance">
    </div>
    <div class="form-actions">
      <a href="{% url 'allsignals' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary"><i data-lucide="save" size="16"></i> Save Signal</button>
    </div>
  </form>
</div>
{% endblock %}
