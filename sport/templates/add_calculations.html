{% extends "dashboard_base.html" %}
{% block title %}Add Calculation — Smart City Platform{% endblock %}
{% block page_title %}Add Calculation{% endblock %}
{% block calculations_active %}active{% endblock %}

{% block content %}
<div class="card form-card" data-aos="fade-up">
  <div class="card-header">
    <h2>New Calculation</h2>
    <a href="{% url 'allcalculations' %}" class="btn btn-secondary"><i data-lucide="arrow-left" size="16"></i> Back</a>
  </div>
  <form method="post" action="{% url 'add_calculation' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="total_vehicles">Total Vehicles</label>
      <input type="number" id="total_vehicles" name="total_vehicles" required>
    </div>
    <div class="form-group">
      <label for="parked_vehicles">Parked Vehicles</label>
      <input type="number" id="parked_vehicles" name="parked_vehicles" required>
    </div>
    <div class="form-group">
      <label for="exited_vehicles">Exited Vehicles</label>
      <input type="number" id="exited_vehicles" name="exited_vehicles" required>
    </div>
    <div class="form-group">
      <label for="total_hours">Total Hours</label>
      <input type="number" id="total_hours" name="total_hours" step="0.1" required>
    </div>
    <div class="form-group">
      <label for="total_amount">Total Amount ($)</label>
      <input type="number" id="total_amount" name="total_amount" step="0.01" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-success"><i data-lucide="check" size="16"></i> Save Calculation</button>
      <a href="{% url 'allcalculations' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
