<!DOCTYPE html>
<html>

<head>
    <title>Citizen Details</title>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff 0%, #f8fbff 100%);
            color: #1f2937;
        }

        .container {
            width: min(560px, 90%);
            margin: 48px auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
            border: 1px solid #e5e7eb;
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
            color: #2563eb;
            font-size: 28px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        input {
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f9fafb;
            color: #111827;
            font-size: 15px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
        }

        .btn {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
        }

        .btn a,
        .btn button {
            flex: 1;
            text-align: center;
            padding: 12px 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn a {
            background: #e5e7eb;
            color: #374151;
        }

        .btn button {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn a:hover,
        .btn button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.15);
        }
    </style>

</head>

<body>

    <div class="container">
        <h1>Citizen Details</h1>
        <form method="post" action="{% url 'add_citizen' %}">
            {% csrf_token %}
            <label class="label">Citizen ID</label>
            <input type="text" value="{{ citizen.id }}">
            <label class="label">Full Name</label>
            <input type="text" value="{{ citizen.full_name }}">
            <label class="label">Phone Number</label>
            <input type="text" value="{{ citizen.phone }}">
            <label class="label">Email</label>
            <input type="text" value="{{ citizen.email }}">
            <label class="label">Address</label>
            <input type="text" value="{{ citizen.address }}">
            <div class="btn">
                <a href="/citizens/">Back to Citizens</a>
                <button type="submit" class="btn">Add Citizen</button>
            </div>
        </form>
    </div>
</body>

</html>
