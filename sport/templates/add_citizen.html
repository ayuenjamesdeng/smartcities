{% extends "dashboard_base.html" %}
{% block title %}Add Citizen — Smart City Platform{% endblock %}
{% block page_title %}Add Citizen{% endblock %}
{% block citizens_active %}active{% endblock %}
{% block content %}
<div class="card form-card" data-aos="fade-up">
  <div class="card-header">
    <h2>New Citizen</h2>
  </div>
  <form method="post" action="{% url 'add_citizen' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_full_name">Full Name</label>
      <input type="text" id="id_full_name" name="full_name" required>
    </div>
    <div class="form-group">
      <label for="id_gender">Gender</label>
      <select id="id_gender" name="gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label for="id_phone">Phone</label>
      <input type="text" id="id_phone" name="phone">
    </div>
    <div class="form-group">
      <label for="id_email">Email</label>
      <input type="email" id="id_email" name="email">
    </div>
    <div class="form-group">
      <label for="id_address">Address</label>
      <input type="text" id="id_address" name="address">
    </div>
    <div class="form-group">
      <label for="id_national_id">National ID</label>
      <input type="text" id="id_national_id" name="national_id">
    </div>
    <div class="form-actions">
      <a href="{% url 'allcitizens' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary"><i data-lucide="save" size="16"></i> Save Citizen</button>
    </div>
  </form>
</div>
{% endblock %}
