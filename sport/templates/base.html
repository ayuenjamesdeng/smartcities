<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Smart City Platform{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: pageFadeIn 0.5s ease forwards;
    }

    @keyframes pageFadeIn { to { opacity: 1; } }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 0 40px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: slideDown 0.5s ease forwards;
    }

    @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .navbar-brand {
      color: #fff;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.03em;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .navbar-brand .brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: transform 0.3s ease;
    }

    .navbar-brand:hover .brand-icon { transform: rotate(-8deg) scale(1.05); }

    .navbar-links { display: flex; align-items: center; gap: 2px; }

    .navbar-links a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s ease;
      position: relative;
    }

    .navbar-links a:hover { color: #fff; background: rgba(255,255,255,0.08); }

    .navbar-links a.active { color: #fff; background: rgba(255,255,255,0.1); }

    .navbar-links a:not(.btn-signin)::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      width: 0;
      height: 2px;
      background: #3b82f6;
      transition: all 0.3s ease;
      transform: translateX(-50%);
      border-radius: 2px;
    }

    .navbar-links a:not(.btn-signin):hover::after { width: 60%; }

    .navbar-links .btn-signin {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      padding: 8px 22px;
      border-radius: 8px;
      font-weight: 600;
      margin-left: 10px;
      box-shadow: 0 2px 8px rgba(59,130,246,0.3);
      transition: all 0.3s ease;
    }

    .navbar-links .btn-signin:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59,130,246,0.5);
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .content { flex: 1; }

    .footer {
      background: #0f172a;
      color: rgba(255,255,255,0.5);
      text-align: center;
      padding: 24px 40px;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <span class="brand-icon"><i data-lucide="building-2" size="18"></i></span>
      SmartCity
    </a>
    <div class="navbar-links">
      <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
      <a href="/services/" class="{% if request.path == '/services/' %}active{% endif %}">Services</a>
      <a href="/about/" class="{% if request.path == '/about/' %}active{% endif %}">About</a>
      <a href="/login/" class="btn-signin"><i data-lucide="log-in" size="16" style="margin-right:6px;vertical-align:middle"></i>Sign In</a>
    </div>
  </nav>

  <main class="content">{% block content %}{% endblock %}</main>

  <footer class="footer">&copy; {% now "Y" %} Smart Cities and Mobility System. All rights reserved.</footer>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 600, once: true, easing: 'ease-out-cubic' });
    lucide.createIcons();
  </script>
</body>
</html>
