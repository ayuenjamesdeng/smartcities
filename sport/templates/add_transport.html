{% extends "dashboard_base.html" %}

{% block transport_active %}active{% endblock %}

{% block page_title %}Add Transport{% endblock %}

{% block content %}
<div class="card form-card" data-aos="fade-up">
  <div class="card-header">
    <h2>Add New Transport</h2>
  </div>
  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label for="vehicle_id">Vehicle ID</label>
      <input type="text" id="vehicle_id" name="vehicle_id" required>
    </div>
    <div class="form-group">
      <label for="route_id">Route ID</label>
      <input type="text" id="route_id" name="route_id" required>
    </div>
    <div class="form-group">
      <label for="driver_name">Driver Name</label>
      <input type="text" id="driver_name" name="driver_name" required>
    </div>
    <div class="form-group">
      <label for="capacity">Capacity</label>
      <input type="number" id="capacity" name="capacity" required>
    </div>
    <div class="form-group">
      <label for="fare">Fare</label>
      <input type="number" id="fare" name="fare" step="0.01" required>
    </div>
    <div class="form-group">
      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i data-lucide="save" size="16"></i> Save Transport</button>
      <a href="{% url 'alltransport' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
