<!DOCTYPE html>
<html>
<head>
    <title>All Routes</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:20px;
        }
        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }
        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:left;
        }
        th{
            background:#007bff;
            color:white;
        }
        a{
            text-decoration:none;
            color:#007bff;
        }
        .btn{
            background:green;
            color:white;
            padding:8px 12px;
            border-radius:5px;
        }
    </style>
</head>
<body>

<h2>All Routes</h2>

<p>
    <a href="{% url 'add_route' %}" class="btn">Add Route</a>
</p>

<table>
    <tr>
        <th>ID</th>
        <th>Route Name</th>
        <th>Start Location</th>
        <th>Destination</th>
        <th>Distance</th>
        <th>Action</th>
    </tr>

    {% for route in routes %}
    <tr>
        <td>{{ route.id }}</td>
        <td>{{ route.route_name }}</td>
        <td>{{ route.start_location }}</td>
        <td>{{ route.destination }}</td>
        <td>{{ route.distance }} km</td>
        <td>
            <a href="{% url 'route_details' route.id %}">View</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="6">No routes found.</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
