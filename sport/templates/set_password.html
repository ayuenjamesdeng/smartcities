{% extends "base.html" %}

{% block title %}Set Your Password{% endblock %}

{% block head %}
<style>
  .setpw-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 68px - 72px);
    padding: 40px 20px;
    background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
  }

  .setpw-card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
    border: 1px solid #e2e8f0;
  }

  .setpw-card h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .setpw-card .sub {
    color: #64748b;
    font-size: 0.9rem;
    margin-bottom: 28px;
  }

  .form-group { margin-bottom: 18px; }

  .form-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }

  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    box-sizing: border-box;
  }

  .form-group input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
  }

  .btn-submit {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 14px rgba(59,130,246,0.3);
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(59,130,246,0.45);
  }

  .btn-submit:active { transform: translateY(0); }
</style>
{% endblock %}

{% block content %}
<div class="setpw-wrapper" data-aos="fade-up" data-aos-duration="700">
  <div class="setpw-card">
    <div style="text-align:center;margin-bottom:8px;" data-aos="zoom-in" data-aos-delay="200">
      <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:inline-flex;align-items:center;justify-content:center;">
        <i data-lucide="key-round" size="28" style="color:#fff;"></i>
      </div>
    </div>
    <h1 style="text-align:center;">Set Your Password</h1>
    <p class="sub" style="text-align:center;">Choose a strong password for your account.</p>
    {% if error %}
    <div style="background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:0.85rem;display:flex;align-items:center;gap:8px;" data-aos="fade-up">
      <i data-lucide="alert-circle" size="16"></i> {{ error }}
    </div>
    {% endif %}
    <form method="post" action="{% url 'set_password' %}">
      {% csrf_token %}
      <div class="form-group" data-aos="fade-up" data-aos-delay="100">
        <label for="new_password"><i data-lucide="lock" size="14"></i> New Password</label>
        <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
      </div>
      <div class="form-group" data-aos="fade-up" data-aos-delay="200">
        <label for="confirm_password"><i data-lucide="lock" size="14"></i> Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
      </div>
      <button type="submit" class="btn-submit" data-aos="fade-up" data-aos-delay="300">
        Set Password <i data-lucide="check-circle" size="18"></i>
      </button>
    </form>
  </div>
</div>
{% endblock %}
