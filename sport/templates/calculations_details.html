<!DOCTYPE html>
<html>
<head>
    <title>Add Calculation</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
        }
        .container{
            width:50%;
            margin:30px auto;
            background:white;
            padding:20px;
            border-radius:8px;
            box-shadow:0 0 10px gray;
        }
        h2{
            text-align:center;
            color:#333;
        }
        label{
            font-weight:bold;
        }
        input, select{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }
        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }
        button:hover{
            background:darkgreen;
        }
        a{
            text-decoration:none;
            color:blue;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Add Calculation</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Vehicle</label>
        <select name="vehicle">
            {% for vehicle in vehicles %}
            <option value="{{ vehicle.id }}">
                {{ vehicle.plate_number }}
            </option>
            {% endfor %}
        </select>

        <label>Parking Hours</label>
        <input type="number" name="hours" required>

        <label>Rate Per Hour</label>
        <input type="number" name="rate" step="0.01" required>

        <label>Total Amount</label>
        <input type="number" name="total_amount" step="0.01" required>

        <button type="submit">Save Calculation</button>
    </form>

    <br>
    <a href="{% url 'all_calculations' %}">← Back to All Calculations</a>
</div>

</body>
</html>
