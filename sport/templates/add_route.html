{% extends "dashboard_base.html" %}

{% block routes_active %}active{% endblock %}

{% block page_title %}Add Route{% endblock %}

{% block content %}
<div class="card form-card" data-aos="fade-up">
  <div class="card-header">
    <h2>Add New Route</h2>
  </div>
  <form method="POST" action="{% url 'add_route' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="route_name">Route Name</label>
      <input type="text" id="route_name" name="route_name" required>
    </div>
    <div class="form-group">
      <label for="start_point">Start Point</label>
      <input type="text" id="start_point" name="start_point" required>
    </div>
    <div class="form-group">
      <label for="end_point">End Point</label>
      <input type="text" id="end_point" name="end_point" required>
    </div>
    <div class="form-group">
      <label for="distance">Distance (km)</label>
      <input type="number" id="distance" name="distance" step="0.1" required>
    </div>
    <div class="form-group">
      <label for="estimated_time">Estimated Time</label>
      <input type="text" id="estimated_time" name="estimated_time" placeholder="e.g. 25 mins" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i data-lucide="save" size="16"></i> Save Route</button>
      <a href="{% url 'allroutes' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
