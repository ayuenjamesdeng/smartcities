<!DOCTYPE html>
<html>
<head>
    <title>Add Route</title>
</head>
<body>

    <h1>Add New Route</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Route Name:</label><br>
        <input type="text" name="route_name"><br><br>

        <label>Start Location:</label><br>
        <input type="text" name="start_location"><br><br>

        <label>Destination:</label><br>
        <input type="text" name="destination"><br><br>

        <label>Distance (km):</label><br>
        <input type="number" name="distance" step="0.1"><br><br>

        <label>Status:</label><br>
        <select name="status">
            <option value="Open">Open</option>
            <option value="Closed">Closed</option>
            <option value="Under Maintenance">Under Maintenance</option>
        </select><br><br>

        <button type="submit">Save Route</button>
    </form>

    <br>
    <a href="{% url 'all_routes' %}">Back to All Routes</a>

</body>
</html>
