<!DOCTYPE html>
<html>
<head>
    <title>All Staff</title>
</head>
<body>

    <h1>All Staff</h1>

    <a href="{% url 'add_staff' %}">Add New Staff</a>
    <br><br>

    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Position</th>
            <th>Phone Number</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>

        {% for staff in staffs %}
        <tr>
            <td>{{ staff.id }}</td>
            <td>{{ staff.full_name }}</td>
            <td>{{ staff.position }}</td>
            <td>{{ staff.phone_number }}</td>
            <td>{{ staff.email }}</td>
            <td>
                <a href="{% url 'staff_details' staff.id %}">Details</a> |
                <a href="{% url 'update_staff' staff.id %}">Update</a> |
                <a href="{% url 'delete_staff' staff.id %}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6">No staff records found.</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="{% url 'home' %}">Back to Home</a>

</body>
</html>
