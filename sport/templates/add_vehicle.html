{% extends "dashboard_base.html" %}
{% block title %}Add Vehicle — Smart City Platform{% endblock %}
{% block page_title %}Add Vehicle{% endblock %}
{% block vehicles_active %}active{% endblock %}
{% block content %}
<div class="card form-card" data-aos="fade-up">
  <div class="card-header">
    <h2>New Vehicle</h2>
  </div>
  <form method="post" action="{% url 'add_vehicle' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_plate_number">Plate Number</label>
      <input type="text" id="id_plate_number" name="plate_number" required>
    </div>
    <div class="form-group">
      <label for="id_vehicle_type">Vehicle Type</label>
      <select id="id_vehicle_type" name="vehicle_type">
        <option value="Car">Car</option>
        <option value="Motorcycle">Motorcycle</option>
        <option value="Bus">Bus</option>
        <option value="Truck">Truck</option>
      </select>
    </div>
    <div class="form-group">
      <label for="id_brand">Brand</label>
      <input type="text" id="id_brand" name="brand">
    </div>
    <div class="form-group">
      <label for="id_color">Color</label>
      <input type="text" id="id_color" name="color">
    </div>
    <div class="form-group">
      <label for="id_manufacture_year">Manufacture Year</label>
      <input type="number" id="id_manufacture_year" name="manufacture_year">
    </div>
    <div class="form-group">
      <label for="id_citizen">Citizen ID</label>
      <input type="text" id="id_citizen" name="citizen" placeholder="Enter citizen ID">
    </div>
    <div class="form-actions">
      <a href="{% url 'allvehicles' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary"><i data-lucide="save" size="16"></i> Save Vehicle</button>
    </div>
  </form>
</div>
{% endblock %}
